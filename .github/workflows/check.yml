name: Check

on:
  workflow_dispatch:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
    paths-ignore:
      - '*.md'
      - '*/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-latest, ubuntu-latest, windows-latest ]
        include:
          - os: macos-latest
            TEST_TASK: macosArm64Test
          - os: windows-latest
            TEST_TASK: mingwX64Test
          - os: ubuntu-latest
            TEST_TASK: check
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    timeout-minutes: 40
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Konan cache
        uses: ./.github/actions/konan-cache
        with:
          job-type: 'test'
      - name: Check
        run: ./gradlew ${{matrix.TEST_TASK}} --stacktrace --no-configuration-cache -PfromForkedPullRequest=${{github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository}}
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
      - name: Upload SARIF files
        if: (success() || failure()) && matrix.os == 'ubuntu-latest'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: build/reports/detekt/merged.sarif
      - name: Test publication
        run: ./gradlew publishToMavenLocal --stacktrace --no-configuration-cache
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_CENTRAL_SIGNING_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_CENTRAL_SIGNING_KEY_PASSWORD }}
      - name: Test DEB build
        run: |
          ./gradlew :cli:buildAllDebs --stacktrace --no-configuration-cache
          sudo dpkg -i cli/build/distributions/*_amd64.deb
          caupain --version
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
      - name: Upload ARM64 DEB
        uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && github.event_name != 'pull_request'
        with:
          name: caupain-arm64-deb
          retention-days: 1
          path: cli/build/distributions/*_arm64.deb
      - name: Test Choco build
        run: |
          ./gradlew :cli:buildChoco --stacktrace --no-configuration-cache
          cd cli\build\distributions\chocolatey
          choco pack
          choco install caupain --debug --verbose --source .
          caupain --version
        if: matrix.os == 'windows-latest' && github.event_name != 'pull_request'
      - name: Upload reports
        uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: check-results-${{ matrix.os }}
          path: '*/build/test-results/**/TEST-*.xml'

  test-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build action
        run: ./gradlew :github-action:assembleAction --stacktrace --no-configuration-cache
      - name: Test action installation
        run: bash github-action/scripts/test-install.sh github-action/build/distributions
      - name: Extract action bundle
        run: |
          mkdir -p github-action/build/bundle
          tar -xzf github-action/build/distributions/caupain-github-action.tar.gz -C github-action/build/bundle
      - name: Run action
        id: default
        uses: ./github-action
        with:
          bundle-path: github-action/build/bundle
          version-catalog: github-action/fixtures/libs.versions.toml
      - name: Check action outputs
        env:
          HAS_UPDATES: ${{ steps.default.outputs.has-updates }}
          UPDATES_COUNT: ${{ steps.default.outputs.updates-count }}
        run: |
          [ "$HAS_UPDATES" = "true" ] || { echo "Expected has-updates to be true, was '$HAS_UPDATES'"; exit 1; }
          [ "$UPDATES_COUNT" = "2" ] || { echo "Expected 2 updates, was '$UPDATES_COUNT'"; exit 1; }
      - name: Run action with a configuration file
        id: configured
        uses: ./github-action
        with:
          bundle-path: github-action/build/bundle
          version-catalog: github-action/fixtures/libs.versions.toml
          config-file: github-action/fixtures/caupain.toml
          output-types: |
            markdown
            json
          output-dir: github-action/build/reports
          job-summary: 'false'
      - name: Check configured action outputs
        env:
          UPDATES_COUNT: ${{ steps.configured.outputs.updates-count }}
          REPORT_PATHS: ${{ steps.configured.outputs.report-paths }}
        run: |
          [ "$UPDATES_COUNT" = "1" ] || { echo "Expected 1 update, was '$UPDATES_COUNT'"; exit 1; }
          printf '%s\n' "$REPORT_PATHS"
          [ -f github-action/build/reports/dependencies-update.md ] || { echo "Missing markdown report"; exit 1; }
          [ -f github-action/build/reports/dependencies-update.json ] || { echo "Missing JSON report"; exit 1; }
      - name: Run action failing on updates
        id: failing
        uses: ./github-action
        continue-on-error: true
        with:
          bundle-path: github-action/build/bundle
          version-catalog: github-action/fixtures/libs.versions.toml
          fail-on-updates: 'true'
          job-summary: 'false'
      - name: Check that the action failed on updates
        env:
          OUTCOME: ${{ steps.failing.outcome }}
        run: |
          [ "$OUTCOME" = "failure" ] || { echo "Expected the step to fail, outcome was '$OUTCOME'"; exit 1; }

  test-arm64-deb:
    runs-on: ubuntu-24.04-arm
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Download ARM64 DEB
        uses: actions/download-artifact@v8
        with:
          name: caupain-arm64-deb
      - name: Install ARM64 DEB
        run: |
          sudo dpkg -i *_arm64.deb
          caupain --version

  merge-reports:
    runs-on: ubuntu-latest
    needs: test
    if: success() || failure()
    steps:
      - name: Merge artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: check-results
          pattern: 'check-results-*'
          delete-merged: true

  test-report:
    runs-on: ubuntu-latest
    needs: merge-reports
    if: success() || failure()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: check-results
      - name: Publish test annotations
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: '*/build/test-results/**/TEST-*.xml'
          annotate_only: true

  build:
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Konan cache
        uses: ./.github/actions/konan-cache
        with:
          job-type: 'build'
      - name: Build binaries and packages
        run: ./gradlew :cli:assembleAll :cli:buildAllDebs --stacktrace --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_isSnapshot: true
      - name: Upload artifacts
        id: upload_artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-release-artifacts
          path: |
            cli/build/bin/zip/*.zip
            cli/build/distributions/*.zip
            cli/build/distributions/*.deb
      - name: Update summary
        run: |
          echo "[Binaries](${{ steps.upload_artifact.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY

env:
  GRADLE_OPTS: -Dorg.gradle.configureondemand=true -Dkotlin.incremental=false -Dorg.gradle.project.kotlin.incremental.multiplatform=false -Dorg.gradle.project.kotlin.native.disableCompilerDaemon=true -Dorg.gradle.jvmargs="-Xmx12g -Dfile.encoding=UTF-8"
