name: Dependency update check

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

jobs:
  checkUpdates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check updates
        uses: deezer/caupain/github-action@snapshot
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
